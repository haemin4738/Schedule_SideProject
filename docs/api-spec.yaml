            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '404':
          description: 지원 내역 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  # ================================================================
  # SPECIAL DAYS
  # ================================================================
  /special-days:
    get:
      tags: [special-days]
      summary: 특일(공휴일·기념일·24절기) 조회
      description: |
        from~to(양끝 포함, 최대 366일)에 걸친 특일을 날짜 → 종류(HOLIDAY → ANNIVERSARY → SOLAR_TERM) → 이름 순으로 반환한다.
        **페이지네이션 없음** — 기간이 최대 366일로 제한되고 1년치가 약 130건이라 한 번에 반환한다(캘린더 월/주 화면 오버레이용).

        - 데이터 출처: 한국천문연구원 특일 정보(공공데이터포털). 서버가 연 단위로 받아 DB 에 저장하고,
          아직 받지 않은 연도(2004 ~ 올해+2)는 첫 조회 때 받는다. 매일 04:00(KST) 올해·내년을 다시 받아
          임시공휴일 지정 등을 반영한다(최대 1일 지연).
        - 외부 API 장애·서버 키 미설정 시에도 오류가 아니라 200 으로 이미 저장된 데이터(없으면 빈 배열)를 반환한다.
        - 같은 날짜·같은 이름의 공휴일이 있으면 기념일 항목은 제외된다. 하루에 여러 건이 있을 수 있다(예: 공휴일 + 절기).
      parameters:
        - name: from
          in: query
          required: true
          description: 시작일 (yyyy-MM-dd, 포함)
          schema:
            type: string
            format: date
            example: '2026-09-01'
        - name: to
          in: query
          required: true
          description: 종료일 (yyyy-MM-dd, 포함). from 부터 최대 366일
          schema:
            type: string
            format: date
            example: '2026-10-31'
      responses:
        '200':
          description: 특일 목록 (없으면 빈 배열)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SpecialDayList'
        '400':
          description: 파라미터 누락/형식 오류, from > to, 366일 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '401':
          description: 인증 필요 (access 토큰 없음/만료)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'


  # ================================================================
  # SSE
  # ================================================================
  /sse/events:
    get:
      tags: [sse]
      summary: 일정 변경 알림 구독
      description: |
        연결 직후 `CONNECTED` 이벤트를 한 번 보낸다(이것으로 연결·재연결을 알 수 있다 — 재연결이면 끊겨 있던 동안의 변경을 다시 조회).
        본인 일정이 생성·수정·삭제되어 커밋되면 `REFRESH` 이벤트(data 는 빈 문자열)를 보낸다. 받으면 보고 있는 기간의 일정을 다시 조회한다.
        - 브라우저 EventSource 는 헤더를 못 붙이므로 이 경로에서만 `token` 쿼리 파라미터로 access token 을 받는다 (Authorization 헤더도 가능)
        - 연결 유지 30분. 같은 사용자가 새로 구독하면 이전 연결은 닫힌다 (사용자당 1개)
        - 만료된 토큰으로 연결하면 401 → 토큰 재발급 후 다시 연결
      parameters:
        - name: token
          in: query
          required: false
          description: access token (Authorization 헤더를 못 쓰는 EventSource 용). 헤더가 없으면 필수이며 없거나 만료되면 401. URL 에 실리므로 서버·프록시 접근 로그에 남을 수 있다
          schema:
            type: string
      responses:
        '200':
          description: 이벤트 스트림
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  event:REFRESH
                  data:
        '401':
          description: 토큰 없음·만료·무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

# ------------------------------------------------------------------
# COMPONENTS
# ------------------------------------------------------------------
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        access 토큰(15분). 토큰이 없거나 만료·위조되면 모든 인증 필요 API가 401
        `{"success":false,"data":null,"error":"인증이 필요합니다."}` 을 반환한다.
        401을 받으면 클라이언트는 /auth/refresh 로 재발급 후 재시도한다.
        토큰에는 type 클레임(access/refresh)이 있으며, refresh 토큰으로 API를 호출하면 401이다.

  schemas:

    # ── 공통 응답 envelope ──────────────────────────────────────────
    ApiResponse_UserResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/UserResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_TokenResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/TokenResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_SocialLoginResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/SocialLoginResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_EventResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/EventResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_Empty:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object, nullable: true, example: null }
        error: { type: string, nullable: true, example: null }

    ApiResponse_Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { type: object, nullable: true, example: null }
        error: { type: string, example: '이미 사용중인 이메일입니다.' }
        code:
          type: string
          enum: [INVALID_REFRESH_TOKEN, SESSION_REVOKED, SOCIAL_APP_TICKET_INVALID, SOCIAL_LINK_EXPIRED,
                 SOCIAL_LINK_WRONG_PASSWORD, SOCIAL_LINK_ATTEMPTS_EXCEEDED]
          description: |
            선택 필드. 클라이언트 분기가 필요한 오류에만 포함되고, 없으면 필드 자체가 생략된다.
            클라이언트는 error 문구가 아니라 code 로만 분기한다.

    PagedResponse_EventSummary:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        error: { type: string, nullable: true, example: null }
        meta:
          $ref: '#/components/schemas/PageMeta'

    ApiResponse_ExpenseCategoryResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/ExpenseCategoryResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_ExpenseCategoryList:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseCategoryResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_ExpenseResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/ExpenseResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_MonthlySummaryResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/MonthlySummaryResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_CategorySummaryResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/CategorySummaryResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_DailySummaryResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/DailySummaryResponse'
        error: { type: string, nullable: true, example: null }

    PagedResponse_JobApplicationSummary:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/JobApplicationSummary'
        error: { type: string, nullable: true, example: null }
        meta:
          $ref: '#/components/schemas/PageMeta'

    PagedResponse_ExpenseSummary:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseSummary'
        error: { type: string, nullable: true, example: null }
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageMeta:
      type: object
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        total: { type: integer, format: int64, example: 100 }
        totalPages: { type: integer, example: 5 }

    # ── Auth ────────────────────────────────────────────────────────
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 9
          maxLength: 15
          pattern: '^(?=.*[A-Za-z])(?=.*\d)(?=.*[!-/:-@\[-`{-~])[A-Za-z\d!-/:-@\[-`{-~]{9,15}$'
          description: 영문, 숫자, 특수문자(ASCII)를 각각 1자 이상 포함한 9~15자. 그 외 문자(공백, 한글 등) 불가. 위반 시 400.
          example: 'Passw0rd!'
        name:
          type: string
          maxLength: 12
          description: 공백만은 불가. 12자 초과 시 400.
          example: 홍길동

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: 폐기할 세션의 refresh 토큰

    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        email: { type: string, example: user@example.com }
        name: { type: string, example: 홍길동 }
        createdAt: { type: string, format: date-time }

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT — 유효기간 15분
        refreshToken:
          type: string
          description: JWT, 재발급 시 교체(회전 직후 30초 겹침 허용) — 비활성 15일 / 최초 로그인 후 최대 30일
        tokenType:
          type: string
          example: Bearer

    SocialLoginRequest:
      type: object
      required: [grantType]
      properties:
        grantType:
          type: string
          enum: [AUTHORIZATION_CODE, ACCESS_TOKEN, ID_TOKEN]
        code:
          type: string
          maxLength: 2048
          description: AUTHORIZATION_CODE 필수
        redirectUri:
          type: string
          maxLength: 2048
          description: AUTHORIZATION_CODE 필수. 인가 요청에 사용한 값과 동일해야 한다.
          example: http://localhost:5173/oauth/callback/google
        codeVerifier:
          type: string
          maxLength: 128
          description: PKCE 사용 시
        nonce:
          type: string
          maxLength: 512
          description: 구글 id_token nonce 검증용 (선택)
        state:
          type: string
          maxLength: 512
          description: 클라이언트가 콜백에서 대조를 마친 state. AUTHORIZATION_CODE + 네이버는 필수
        accessToken:
          type: string
          maxLength: 8192
          description: ACCESS_TOKEN 필수 (카카오 SDK)
        idToken:
          type: string
          maxLength: 8192
          description: ID_TOKEN 필수 (구글 SDK)

    SocialLoginResponse:
      type: object
      properties:
        status:
          type: string
          enum: [LOGGED_IN, LINK_REQUIRED]
        newUser:
          type: boolean
          description: 이번 요청으로 가입했으면 true
        token:
          allOf:
            - $ref: '#/components/schemas/TokenResponse'
          nullable: true
          description: LOGGED_IN 일 때만 존재
        link:
          allOf:
            - $ref: '#/components/schemas/SocialLinkInfo'
          nullable: true
          description: LINK_REQUIRED 일 때만 존재

    SocialLinkInfo:
      type: object
      properties:
        linkToken:
          type: string
          description: 1회용 opaque 토큰
        provider:
          type: string
          enum: [KAKAO, NAVER, GOOGLE]
        maskedEmail:
          type: string
          example: le***@gmail.com
        expiresInSeconds:
          type: integer
          format: int64
          example: 600

    SocialLinkRequest:
      type: object
      required: [linkToken, password]
      properties:
        linkToken:
          type: string
          maxLength: 128
        password:
          type: string
          maxLength: 128

    NaverAppStartRequest:
      type: object
      required: [codeChallenge]
      properties:
        codeChallenge:
          type: string
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: BASE64URL(SHA-256(codeVerifier)), 패딩 없음
          example: E9Melhoa2OwvFrEMTJguCHaoeK1t8URWbuGJSstw-cM

    NaverAppStartResponse:
      type: object
      properties:
        authorizeUrl:
          type: string
          example: 'https://nid.naver.com/oauth2.0/authorize?response_type=code&client_id=xxx&redirect_uri=...&state=...'
        expiresInSeconds:
          type: integer
          format: int64
          example: 600

    NaverAppCompleteRequest:
      type: object
      required: [ticket, codeVerifier]
      properties:
        ticket:
          type: string
          maxLength: 128
        codeVerifier:
          type: string
          pattern: '^[A-Za-z0-9._~-]{43,128}$'
          description: RFC 7636 문자 집합 43~128자
          example: dBjftJeZ4CVP-mB92K27uhbUJU1p1r_wW1gFWFOEjXk

    # ── Events ──────────────────────────────────────────────────────
    EventRequest:
      type: object
      required: [title, startAt]
      properties:
        title:
          type: string
          maxLength: 200
          example: 팀 미팅
        description:
          type: string
          nullable: true
          maxLength: 10000
          example: 주간 스프린트 리뷰
        startAt:
          type: string
          format: date-time
          example: '2025-02-01T10:00:00'
        endAt:
          type: string
          format: date-time
          nullable: true
          description: 없으면 종료 없음. 있으면 startAt 이상이어야 한다(아니면 400 "종료 시간은 시작 시간보다 빠를 수 없습니다.")
          example: '2025-02-01T11:00:00'
        allDay:
          type: boolean
          default: false
        location:
          type: string
          nullable: true
          maxLength: 255
          example: 강남구 선릉
        color:
          type: string
          nullable: true
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: HEX 색상 코드 #RRGGBB. null 이면 카테고리 기본 색. 빈 문자열·형식 불일치는 400
          example: '#4A90E2'
        eventCategory:
          type: string
          enum: [PERSONAL, WORK, REMINDER, OTHER]
          default: PERSONAL

    EventResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: 팀 미팅 }
        description: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        allDay: { type: boolean }
        location: { type: string, nullable: true }
        color: { type: string, nullable: true }
        eventCategory:
          type: string
          enum: [PERSONAL, WORK, REMINDER, OTHER]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventSummary:
      description: 목록 조회용 — 상세 필드 제외
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        allDay: { type: boolean }
        color: { type: string, nullable: true }
        eventCategory:
          type: string
          enum: [PERSONAL, WORK, REMINDER, OTHER]

    # ── Expenses ────────────────────────────────────────────────────
    ExpenseType:
      type: string
      enum: [EXPENSE, INCOME]

    ExpenseCategoryCreateRequest:
      type: object
      required: [type, name]
      properties:
        type:
          $ref: '#/components/schemas/ExpenseType'
        name:
          type: string
          maxLength: 50
          description: 앞뒤 공백은 제거되어 저장됨. (사용자, 유형, 이름) 유니크
          example: 식비

    ExpenseCategoryUpdateRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 50
          example: 외식

    ExpenseCategoryResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        type:
          $ref: '#/components/schemas/ExpenseType'
        name: { type: string, example: 식비 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExpenseRequest:
      type: object
      required: [type, categoryId, amount, transactionDate]
      properties:
        type:
          $ref: '#/components/schemas/ExpenseType'
        categoryId:
          type: integer
          format: int64
          description: 카테고리 유형이 type과 일치해야 함
          example: 1
        amount:
          type: integer
          format: int64
          minimum: 1
          maximum: 99999999999
          description: 원(KRW) 단위 정수
          example: 12000
        transactionDate:
          type: string
          format: date
          example: '2026-09-28'
        description:
          type: string
          maxLength: 200
          nullable: true
          example: 점심
        memo:
          type: string
          nullable: true
          maxLength: 10000

    ExpenseResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        type:
          $ref: '#/components/schemas/ExpenseType'
        categoryId: { type: integer, format: int64, example: 1 }
        categoryName: { type: string, example: 식비 }
        amount: { type: integer, format: int64, example: 12000 }
        transactionDate: { type: string, format: date }
        description: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ExpenseSummary:
      description: 목록 조회용 — memo 및 시각 필드 제외
      type: object
      properties:
        id: { type: integer, format: int64 }
        type:
          $ref: '#/components/schemas/ExpenseType'
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        amount: { type: integer, format: int64 }
        transactionDate: { type: string, format: date }
        description: { type: string, nullable: true }

    MonthlySummaryResponse:
      type: object
      properties:
        from: { type: string, example: '2026-01', description: yyyy-MM }
        to: { type: string, example: '2026-09', description: yyyy-MM }
        totalIncome: { type: integer, format: int64 }
        totalExpense: { type: integer, format: int64 }
        net: { type: integer, format: int64, description: totalIncome - totalExpense }
        months:
          type: array
          items:
            $ref: '#/components/schemas/MonthlyItem'

    MonthlyItem:
      type: object
      properties:
        yearMonth: { type: string, example: '2026-09', description: yyyy-MM }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        net: { type: integer, format: int64 }

    CategorySummaryResponse:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/ExpenseType'
        from: { type: string, format: date }
        to: { type: string, format: date }
        total: { type: integer, format: int64 }
        categories:
          type: array
          description: amount 내림차순
          items:
            $ref: '#/components/schemas/CategoryItem'

    CategoryItem:
      type: object
      properties:
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        amount: { type: integer, format: int64 }
        count: { type: integer, format: int64 }

    DailySummaryResponse:
      type: object
      properties:
        from: { type: string, format: date, example: '2026-09-01' }
        to: { type: string, format: date, example: '2026-09-30' }
        totalIncome: { type: integer, format: int64 }
        totalExpense: { type: integer, format: int64 }
        net: { type: integer, format: int64, description: totalIncome - totalExpense }
        days:
          type: array
          description: 내역이 있는 날짜만 포함(sparse), 날짜 오름차순
          items:
            $ref: '#/components/schemas/DailyItem'

    DailyItem:
      type: object
      properties:
        date: { type: string, format: date, example: '2026-09-03' }
        income: { type: integer, format: int64 }
        expense: { type: integer, format: int64 }
        net: { type: integer, format: int64, description: income - expense }

    # ── Job Applications ───────────────────────────────────────────
    JobApplicationStatus:
      type: string
      enum: [APPLIED, DOCUMENT_PASS, DOCUMENT_FAIL, INTERVIEW_SCHEDULED, INTERVIEW_PASS,
             INTERVIEW_FAIL, OFFER, ACCEPTED, REJECTED, WITHDRAWN]

    JobApplicationSummary:
      description: 목록 조회용 — jobPostingUrl, memo 및 시각 필드 제외
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        companyName: { type: string, example: 회사A }
        position: { type: string, example: 백엔드 개발자 }
        status:
          $ref: '#/components/schemas/JobApplicationStatus'
        appliedAt: { type: string, format: date, example: '2026-09-10' }

    JobApplicationRequest:
      type: object
      required: [companyName, position, status, appliedAt]
      properties:
        companyName: { type: string, maxLength: 200, example: 회사A }
        position: { type: string, maxLength: 200, example: 백엔드 개발자 }
        status:
          $ref: '#/components/schemas/JobApplicationStatus'
        appliedAt: { type: string, format: date, example: '2026-09-10' }
        jobPostingUrl: { type: string, maxLength: 500, nullable: true, example: 'https://example.com/jobs/1' }
        memo: { type: string, nullable: true, maxLength: 10000, example: 1차 면접 9/20 }

    JobApplicationResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        companyName: { type: string, example: 회사A }
        position: { type: string, example: 백엔드 개발자 }
        status:
          $ref: '#/components/schemas/JobApplicationStatus'
        appliedAt: { type: string, format: date, example: '2026-09-10' }
        jobPostingUrl: { type: string, nullable: true, example: 'https://example.com/jobs/1' }
        memo: { type: string, nullable: true, example: 1차 면접 9/20 }
        createdAt: { type: string, format: date-time, example: '2026-09-10T09:00:00' }
        updatedAt: { type: string, format: date-time, example: '2026-09-12T18:30:00' }

    ApiResponse_JobApplicationResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/JobApplicationResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_SpecialDayList:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/SpecialDay'
        error: { type: string, nullable: true, example: null }

    SpecialDayKind:
      type: string
      enum: [HOLIDAY, ANNIVERSARY, SOLAR_TERM]
      description: |
        HOLIDAY = 공휴일(쉬는 날, 대체공휴일·선거일 등 포함), ANNIVERSARY = 기념일, SOLAR_TERM = 24절기

    SpecialDay:
      type: object
      properties:
        date: { type: string, format: date, example: '2026-10-03' }
        name: { type: string, maxLength: 100, example: 개천절 }
        kind:
          $ref: '#/components/schemas/SpecialDayKind'
        holiday:
          type: boolean
          description: 쉬는 날 여부 (kind 가 HOLIDAY 일 때만 true)
          example: true
