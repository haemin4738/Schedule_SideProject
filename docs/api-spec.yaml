openapi: 3.0.3
info:
  title: Lifelog API
  description: 일정관리 기반 라이프로그 서비스 API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발

tags:
  - name: auth
    description: 인증 (회원가입 / 로그인 / 토큰 재발급 / 로그아웃)
  - name: events
    description: 일정 관리 CRUD

# ------------------------------------------------------------------
# 보안: 모든 엔드포인트는 기본적으로 BearerAuth 필요
#        auth 엔드포인트만 security: [] 로 override
# ------------------------------------------------------------------
security:
  - BearerAuth: []

paths:

  # ================================================================
  # AUTH
  # ================================================================
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_UserResponse'
        '409':
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공 — access/refresh 토큰 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TokenResponse'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/refresh:
    post:
      tags: [auth]
      summary: 액세스 토큰 재발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 새 액세스 토큰 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TokenResponse'
        '401':
          description: refresh 토큰 만료 또는 무효
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (refresh 토큰 무효화)
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Empty'

  # ================================================================
  # EVENTS
  # ================================================================
  /events:
    get:
      tags: [events]
      summary: 일정 목록 조회
      parameters:
        - name: from
          in: query
          description: 조회 시작일 (ISO 8601, 포함)
          schema:
            type: string
            format: date-time
            example: '2025-01-01T00:00:00'
        - name: to
          in: query
          description: 조회 종료일 (ISO 8601, 포함)
          schema:
            type: string
            format: date-time
            example: '2025-01-31T23:59:59'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 일정 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse_EventSummary'

    post:
      tags: [events]
      summary: 일정 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: 생성된 일정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EventResponse'
        '400':
          description: 유효성 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /events/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64

    get:
      tags: [events]
      summary: 일정 단건 조회
      responses:
        '200':
          description: 일정 상세
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EventResponse'
        '404':
          description: 일정 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

    put:
      tags: [events]
      summary: 일정 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '200':
          description: 수정된 일정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EventResponse'
        '403':
          description: 본인 일정 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '404':
          description: 일정 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

    delete:
      tags: [events]
      summary: 일정 삭제
      responses:
        '200':
          description: 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Empty'
        '403':
          description: 본인 일정 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '404':
          description: 일정 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

# ------------------------------------------------------------------
# COMPONENTS
# ------------------------------------------------------------------
components:

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    # ── 공통 응답 envelope ──────────────────────────────────────────
    ApiResponse_UserResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/UserResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_TokenResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/TokenResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_EventResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          $ref: '#/components/schemas/EventResponse'
        error: { type: string, nullable: true, example: null }

    ApiResponse_Empty:
      type: object
      properties:
        success: { type: boolean, example: true }
        data: { type: object, nullable: true, example: null }
        error: { type: string, nullable: true, example: null }

    ApiResponse_Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        data: { type: object, nullable: true, example: null }
        error: { type: string, example: '이미 사용중인 이메일입니다.' }

    PagedResponse_EventSummary:
      type: object
      properties:
        success: { type: boolean, example: true }
        data:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        error: { type: string, nullable: true, example: null }
        meta:
          $ref: '#/components/schemas/PageMeta'

    PageMeta:
      type: object
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        total: { type: integer, format: int64, example: 100 }
        totalPages: { type: integer, example: 5 }

    # ── Auth ────────────────────────────────────────────────────────
    SignupRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          example: user@example.com
        password:
          type: string
          minLength: 8
          example: 'P@ssw0rd!'
        name:
          type: string
          example: 홍길동

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    UserResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        email: { type: string, example: user@example.com }
        name: { type: string, example: 홍길동 }
        createdAt: { type: string, format: date-time }

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT — 유효기간 15분
        refreshToken:
          type: string
          description: JWT — 유효기간 7일
        tokenType:
          type: string
          example: Bearer

    # ── Events ──────────────────────────────────────────────────────
    EventRequest:
      type: object
      required: [title, startAt]
      properties:
        title:
          type: string
          maxLength: 200
          example: 팀 미팅
        description:
          type: string
          nullable: true
          example: 주간 스프린트 리뷰
        startAt:
          type: string
          format: date-time
          example: '2025-02-01T10:00:00'
        endAt:
          type: string
          format: date-time
          nullable: true
          example: '2025-02-01T11:00:00'
        allDay:
          type: boolean
          default: false
        location:
          type: string
          nullable: true
          example: 강남구 선릉
        color:
          type: string
          nullable: true
          description: HEX 색상 코드
          example: '#4A90E2'
        eventCategory:
          type: string
          enum: [PERSONAL, WORK, REMINDER, OTHER]
          default: PERSONAL

    EventResponse:
      type: object
      properties:
        id: { type: integer, format: int64, example: 1 }
        title: { type: string, example: 팀 미팅 }
        description: { type: string, nullable: true }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        allDay: { type: boolean }
        location: { type: string, nullable: true }
        color: { type: string, nullable: true }
        eventCategory:
          type: string
          enum: [PERSONAL, WORK, REMINDER, OTHER]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    EventSummary:
      description: 목록 조회용 — 상세 필드 제외
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time, nullable: true }
        allDay: { type: boolean }
        color: { type: string, nullable: true }
        eventCategory:
          type: string
          enum: [PERSONAL, WORK, REMINDER, OTHER]
