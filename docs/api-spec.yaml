          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ExpenseCategoryResponse'
        '400':
          description: 유효성 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '403':
          description: 본인 카테고리 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '404':
          description: 카테고리 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '409':
          description: 같은 유형 내 이름 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

    delete:
      tags: [expense-categories]
