openapi: 3.0.3
info:
  title: Lifelog API
  description: 일정관리 기반 라이프로그 서비스 API
  version: 1.0.0

servers:
  - url: http://localhost:8080/api/v1
    description: 로컬 개발

tags:
  - name: auth
    description: 인증 (회원가입 / 로그인 / 소셜 로그인 / 토큰 재발급 / 로그아웃)
  - name: events
    description: 일정 관리 CRUD
  - name: expense-categories
    description: 가계부 카테고리 관리
  - name: expenses
    description: 가계부 내역 CRUD / 요약
  - name: job-applications
    description: 구직활동(지원 내역) CRUD
  - name: special-days
    description: 공휴일·기념일·24절기 (한국천문연구원 특일 정보, 사용자 공용 데이터)
  - name: sse
    description: 실시간 알림 (Server-Sent Events)

# ------------------------------------------------------------------
# 보안: 모든 엔드포인트는 기본적으로 BearerAuth 필요
#        auth 엔드포인트만 security: [] 로 override
# ------------------------------------------------------------------
security:
  - BearerAuth: []

paths:

  # ================================================================
  # AUTH
  # ================================================================
  /auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: 가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_UserResponse'
        '409':
          description: 이메일 중복
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/login:
    post:
      tags: [auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공 — access/refresh 토큰 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TokenResponse'
        '401':
          description: 이메일 또는 비밀번호 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '503':
          description: 인증 세션 저장소(Redis) 장애 — 고정 문구, 잠시 후 재시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/refresh:
    post:
      tags: [auth]
      summary: 액세스 토큰 재발급 (refresh 토큰 회전)
      description: |
        refresh 토큰은 회전된다. 성공하면 새 access/refresh 토큰을 반환하며, 클라이언트는 반드시 응답의 새 refresh 토큰으로 교체 저장해야 한다.

        겹침 구간: 회전 직후 30초 동안은 직전 refresh 토큰으로도 재발급된다(200, 같은 세션 유지 — 탭 동시 refresh·응답 유실 재시도 대비).
        30초가 지나 직전 토큰을 내면 그 세션만 종료(401 `INVALID_REFRESH_TOKEN`). 두 세대 이상 지난 토큰은 `SESSION_REVOKED`.

        수명: 로그인 세션은 마지막 재발급 후 15일 동안 사용하지 않으면 만료(비활성 수명)되고,
        재발급을 계속해도 최초 로그인 후 30일이 지나면 만료(절대 수명)된다. 만료 시 401 `INVALID_REFRESH_TOKEN`.

        오류 분기는 `code` 로만 한다:
        - 401 `INVALID_REFRESH_TOKEN`: 무효/만료/레거시 토큰 또는 로그아웃된 세션 → 조용히 로그인 화면으로
        - 401 `SESSION_REVOKED`: 두 세대 이상 지난 refresh 토큰이 다시 제출되어(탈취 의심) 해당 사용자의 모든 세션이 폐기됨 →
          "모든 기기에서 로그아웃되었다"는 안내 후 로그인 화면으로. 다른 기기는 다음 재발급 시 같은 응답을 받는다
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 새 access/refresh 토큰 반환 (세션 유지, refresh 토큰 교체)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TokenResponse'
        '400':
          description: refreshToken 누락/공백
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '401':
          description: |
            refresh 불가. `code` 로 구분 — `INVALID_REFRESH_TOKEN`(무효/만료/로그아웃된 세션, 겹침 구간 경과 후 직전 토큰, access 토큰 제출 포함),
            `SESSION_REVOKED`(두 세대 이상 지난 토큰 재사용 탐지로 사용자 전체 세션 폐기)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
              examples:
                invalid:
                  value: { success: false, data: null, error: '유효하지 않은 refresh 토큰입니다.', code: INVALID_REFRESH_TOKEN }
                revoked:
                  value: { success: false, data: null, error: '보안을 위해 모든 기기에서 로그아웃되었습니다. 다시 로그인해 주세요.', code: SESSION_REVOKED }
        '503':
          description: 인증 세션 저장소(Redis) 장애 — 고정 문구, 잠시 후 재시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (refresh 세션 서버 무효화)
      description: |
        제출한 refresh 토큰의 세션을 서버에서 폐기한다. 인증 헤더 불필요(access 만료 상태에서도 호출 가능).
        멱등 — 무효/만료/레거시 토큰이거나 이미 로그아웃된 세션이어도 200.
        access 토큰은 stateless 이므로 로그아웃 후에도 만료(최대 15분)까지 유효하다. 클라이언트는 로컬 토큰을 먼저 삭제한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: 로그아웃 처리됨 (세션 유무와 무관)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Empty'
        '400':
          description: refreshToken 누락/공백
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '503':
          description: 인증 세션 저장소(Redis) 장애 — 고정 문구, 잠시 후 재시도
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/social/{provider}/login:
    post:
      tags: [auth]
      summary: 소셜 로그인 (카카오 / 네이버 / 구글)
      description: |
        클라이언트가 제공자에게서 받은 자격증명을 넘기면 백엔드가 제공자에 검증한 뒤 결과를 반환한다.
        결과는 HTTP 200 고정이며 `data.status` 로 분기한다.
        - `LOGGED_IN`: `data.token` 에 access/refresh 토큰. 처음 가입이면 `newUser: true`.
        - `LINK_REQUIRED`: 같은 이메일의 일반 회원이 있어 비밀번호 확인이 필요하다. `data.link.linkToken` 과 비밀번호로 `/auth/social/link` 를 호출한다.

        grantType 별 필수값 (누락 시 400):
        - `AUTHORIZATION_CODE`: code, redirectUri (codeVerifier, nonce, state 선택 — **네이버는 state 필수**). redirectUri 는 서버 허용 목록과 정확히 일치해야 한다.
        - `ACCESS_TOKEN`: accessToken — 카카오만 허용
        - `ID_TOKEN`: idToken (nonce 선택) — 구글만 허용
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: 대소문자 무시. 그 외 값은 400.
          schema:
            type: string
            enum: [kakao, naver, google]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      responses:
        '200':
          description: 로그인 성공(LOGGED_IN) 또는 계정 연결 필요(LINK_REQUIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SocialLoginResponse'
        '400':
          description: 지원하지 않는 provider, grantType 별 필수값 누락, 제공자가 허용하지 않는 grantType, 허용 목록 밖 redirectUri, 인증된 이메일 미제공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '401':
          description: 제공자 자격증명이 유효하지 않음 (만료/위조/audience 불일치 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '409':
          description: 다른 소셜 로그인으로 가입된 이메일, 같은 제공자의 다른 계정이 이미 연결된 회원, 동시 가입 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '502':
          description: 제공자 서버 오류 또는 타임아웃
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '503':
          description: 해당 제공자 설정이 없어 일시적으로 사용할 수 없음, 또는 연결 대기/인증 세션 저장소(Redis) 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/social/link:
    post:
      tags: [auth]
      summary: 소셜 계정 연결 (LINK_REQUIRED 후 비밀번호 확인)
      description: |
        소셜 로그인에서 받은 1회용 linkToken(유효 10분)과 기존 회원 비밀번호를 제출하면 소셜 계정을 연결하고 토큰을 발급한다.
        비밀번호를 5회 틀리면 linkToken 이 폐기되며, 소셜 로그인부터 다시 시도해야 한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLinkRequest'
      responses:
        '200':
          description: 연결 성공 — access/refresh 토큰 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_TokenResponse'
        '400':
          description: 필수값 누락 또는 길이 초과 (linkToken·password 각 최대 128자)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '401':
          description: |
            code 로 분기한다.
            - `SOCIAL_LINK_WRONG_PASSWORD`: 비밀번호 불일치 — 같은 화면에서 다시 입력
            - `SOCIAL_LINK_ATTEMPTS_EXCEEDED`: 5회 초과로 linkToken 폐기 — 소셜 로그인부터 다시
            - `SOCIAL_LINK_EXPIRED`: linkToken 만료·이미 사용됨 — 소셜 로그인부터 다시
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '409':
          description: 그 사이 해당 소셜 계정 또는 같은 제공자 계정이 이미 연결됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '503':
          description: 연결 대기 저장소 또는 인증 세션 저장소(Redis) 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/social/naver/app/start:
    post:
      tags: [auth]
      summary: 네이버 앱(iOS) 로그인 시작
      description: |
        앱이 32바이트 이상 난수 codeVerifier 를 만들어 메모리에만 두고, `BASE64URL(SHA-256(codeVerifier))`(패딩 없음 43자)를 보낸다.
        서버는 그 값에 묶인 1회용 state(유효 10분)를 발급하고 네이버 authorize URL 을 돌려준다.
        앱은 이 URL 을 ASWebAuthenticationSession(flutter_web_auth_2, callbackUrlScheme `lifelog`)으로 그대로 연다.
        네이버 code 는 서버 콜백에서 교환되며 앱으로 전달되지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaverAppStartRequest'
      responses:
        '200':
          description: authorize URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/NaverAppStartResponse' }
                  error: { type: string, nullable: true, example: null }
        '400':
          description: codeChallenge 누락·형식 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '503':
          description: 네이버 앱 로그인 설정 누락 또는 저장소(Redis) 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /auth/social/naver/app-callback:
    get:
      tags: [auth]
      summary: 네이버 앱(iOS) 로그인 콜백 (리다이렉트 전용)
      description: |
        네이버 redirect_uri(`oauth.naver.app-redirect-uri`, 환경변수 `NAVER_APP_REDIRECT_URI`).
        state 를 1회 소비하고 서버가 code 를 직접 교환한 뒤, 결과를 1회용 ticket(유효 2분)으로 만들어
        고정 대상(`oauth.naver.app-callback-target`, 예 `lifelog://oauth/naver`)에 `?ticket=` 으로 302 한다.
        실패 시 `?error=` 고정 코드만 붙인다(제공자 원문은 전달하지 않음):
        - `ACCESS_DENIED`: 사용자 취소·네이버 error
        - `INVALID_STATE`: state 없음·만료·이미 사용됨
        - `PROVIDER_ERROR`: code 교환·프로필 조회 실패, 저장소 장애
        요청 값으로 리다이렉트 대상이 바뀌지 않는다. 응답 envelope 을 쓰지 않으며
        `Cache-Control: no-store`, `Referrer-Policy: no-referrer` 헤더를 붙인다.
      security: []
      parameters:
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302':
          description: 앱 고정 대상으로 리다이렉트
          headers:
            Location:
              schema: { type: string, example: 'lifelog://oauth/naver?ticket=Q2hhbGxlbmdl' }
            Cache-Control:
              schema: { type: string, example: no-store }
            Referrer-Policy:
              schema: { type: string, example: no-referrer }

  /auth/social/naver/app/complete:
    post:
      tags: [auth]
      summary: 네이버 앱(iOS) 로그인 완료
      description: |
        콜백에서 받은 ticket 과 시작 때의 codeVerifier 를 보낸다. 서버는 ticket 을 1회 소비하고
        `BASE64URL(SHA-256(codeVerifier))` 가 시작 때의 codeChallenge 와 같을 때만 웹 소셜 로그인과 같은 판정을 한다.
        응답은 `/auth/social/{provider}/login` 과 같다(LOGGED_IN / LINK_REQUIRED).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NaverAppCompleteRequest'
      responses:
        '200':
          description: 판정 결과 — data.status 로 분기
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_SocialLoginResponse'
        '400':
          description: 필수값 누락·형식 오류, 또는 네이버 계정 이메일 미제공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '401':
          description: |
            `SOCIAL_APP_TICKET_INVALID`: ticket 없음·만료·이미 사용됨·codeVerifier 불일치(구분하지 않음, ticket 은 소비됨) — 로그인을 처음부터 다시
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '409':
          description: 다른 소셜로 가입된 이메일, 같은 제공자의 다른 계정이 이미 연결됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '503':
          description: 저장소(Redis) 장애
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  # ================================================================
  # EVENTS
  # ================================================================
  /events:
    get:
      tags: [events]
      summary: 일정 목록 조회
      parameters:
        - name: from
          in: query
          description: 조회 시작 (ISO 8601 LocalDateTime, 포함). 이 시각 이후에 끝나는(종료 없으면 시작하는) 일정 — 기간에 걸친 여러 날 일정 포함
          schema:
            type: string
            format: date-time
            example: '2025-01-01T00:00:00'
        - name: to
          in: query
          description: 조회 끝 (ISO 8601 LocalDateTime, 포함). 이 시각 이전에 시작하는 일정
          schema:
            type: string
            format: date-time
            example: '2025-01-31T23:59:59'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: 일정 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse_EventSummary'

    post:
      tags: [events]
      summary: 일정 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
      responses:
        '201':
          description: 생성된 일정
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_EventResponse'
        '400':
