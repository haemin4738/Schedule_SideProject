    get:
      tags: [expenses]
      summary: 카테고리별 합계
      description: 금액 내림차순. 최대 366일.
      parameters:
        - name: type
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/ExpenseType'
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-01'
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
            example: '2026-09-30'
      responses:
