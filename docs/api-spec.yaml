  /expenses/summary/monthly:
    get:
      tags: [expenses]
      summary: 월별 수입/지출 요약
      description: 기간 내 모든 달을 포함하며 내역이 없는 달은 0으로 채운다. 최대 12개월.
      parameters:
        - name: from
          in: query
          required: true
          description: 시작 월 (yyyy-MM)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-01'
        - name: to
          in: query
          required: true
          description: 종료 월 (yyyy-MM, 포함)
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
            example: '2026-09'
      responses:
        '200':
          description: 월별 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_MonthlySummaryResponse'
        '400':
          description: 파라미터 누락/형식 오류, from > to, 12개월 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  /expenses/summary/daily:
    get:
      tags: [expenses]
      summary: 일별 수입/지출 요약
      description: |
        내역이 있는 날짜만 포함한다(sparse). 내역이 없는 날짜는 days 에 나타나지 않으며,
        클라이언트는 누락된 날짜를 0으로 간주한다. (월별 요약은 빈 달을 0으로 채우는 dense 응답이다.)
        days 는 날짜 오름차순. 최대 366일. 캐시 없음.
      parameters:
        - name: from
          in: query
          required: true
          description: 조회 시작일 (포함)
          schema:
            type: string
            format: date
            example: '2026-09-01'
        - name: to
          in: query
          required: true
          description: 조회 종료일 (포함). from보다 이르면 400
          schema:
            type: string
            format: date
            example: '2026-09-30'
      responses:
        '200':
          description: 일별 요약
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_DailySummaryResponse'
        '400':
          description: 파라미터 누락/형식 오류, from > to, 366일 초과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

