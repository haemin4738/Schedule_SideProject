              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

  # ================================================================
  # EXPENSES
  # ================================================================
  /expenses:
    get:
      tags: [expenses]
      summary: 가계부 내역 목록 조회
      description: 거래일 내림차순, 같은 날짜는 id 내림차순.
      parameters:
        - name: from
          in: query
          description: 조회 시작일 (포함)
          schema:
            type: string
            format: date
            example: '2026-09-01'
        - name: to
          in: query
          description: 조회 종료일 (포함). from보다 이르면 400
          schema:
            type: string
            format: date
            example: '2026-09-30'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ExpenseType'
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: 내역 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse_ExpenseSummary'
        '400':
          description: 잘못된 파라미터 (from > to, size 범위 초과 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

    post:
      tags: [expenses]
      summary: 가계부 내역 생성
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseRequest'
      responses:
        '201':
          description: 생성된 내역
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ExpenseResponse'
        '400':
          description: 유효성 오류 또는 카테고리 유형과 내역 유형 불일치
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '403':
          description: 본인 카테고리 아님
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '404':
          description: 카테고리 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'
        '409':
          description: 처리 중 카테고리가 동시에 삭제되어 데이터 제약 조건과 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_Error'

