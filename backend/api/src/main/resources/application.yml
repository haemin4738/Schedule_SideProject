spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/lifelog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:lifelog}
    password: ${DB_PASSWORD:lifelog}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  jackson:
    # Boot 4 기본 Jackson 3는 기본값이 달라(누락된 primitive 필드 거부 등) 기존 클라이언트 요청이 400이 된다 → Jackson 2 기본값 유지
    use-jackson2-defaults: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000      # 15분
  refresh-expiration: 604800000  # 7일

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
