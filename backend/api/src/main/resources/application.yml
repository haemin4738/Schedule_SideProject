spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/lifelog?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:lifelog}
    password: ${DB_PASSWORD:lifelog}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
  jackson:
    # Boot 4 기본 Jackson 3는 기본값이 달라(누락된 primitive 필드 거부 등) 기존 클라이언트 요청이 400이 된다 → Jackson 2 기본값 유지
    use-jackson2-defaults: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 900000      # 15분
  refresh-idle-expiration: 1296000000      # 15일 — 마지막 회전 후 미사용 시 만료
  refresh-absolute-expiration: 2592000000  # 30일 — 최초 로그인 기준 최대 수명(회전해도 연장 안 됨)

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

# 소셜 로그인 제공자 설정 — 값이 비어 있으면 기동은 되고 해당 제공자 호출 시 503
# allowed-redirect-uris: 정확히 일치하는 값만 허용. 기본값은 로컬 개발용 —
#   운영 배포(Phase 6) 시 application-prod.yml 에서 운영 도메인 목록으로 덮어쓴다
oauth:
  http:
    connect-timeout: 3s
    read-timeout: 5s
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}          # REST API 키
    client-secret: ${KAKAO_CLIENT_SECRET:}
    app-id: ${KAKAO_APP_ID:}                # access token 발급 앱 대조용
    allowed-redirect-uris:
      - http://localhost:5173/oauth/callback/kakao
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    app-callback-target: lifelog://oauth/naver
    allowed-redirect-uris:
      - http://localhost:5173/oauth/callback/naver
      - http://localhost:8080/api/v1/auth/social/naver/app-callback
  google:
    client-id: ${GOOGLE_WEB_CLIENT_ID:}
    client-secret: ${GOOGLE_WEB_CLIENT_SECRET:}
    allowed-redirect-uris:
      - http://localhost:5173/oauth/callback/google
    allowed-audiences:                      # id_token aud 허용 목록 (웹 + iOS), 빈 값은 무시
      - ${GOOGLE_WEB_CLIENT_ID:}
      - ${GOOGLE_IOS_CLIENT_ID:}

# 특일(공휴일·기념일·24절기) — 한국천문연구원 특일 정보(공공데이터포털 SpcdeInfoService)
# service-key 가 비어 있으면 기동은 되고 외부 조회만 생략(이미 저장된 데이터 또는 빈 목록 반환)
special-day:
  service-key: ${DATA_GO_KR_SERVICE_KEY:}   # 일반 인증키 — Encoding/Decoding 형태 모두 허용
  http:
    connect-timeout: 3s
    read-timeout: 5s
  sync:
    enabled: true                  # 매일 올해·내년 재동기화(임시공휴일 반영)
    # cron: 기본값은 SpecialDaySyncScheduler.CRON 한 곳에서 정의(04:00 Asia/Seoul). 바꿀 때만 지정
