spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/lifelog_test?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:lifelog}
    password: ${DB_PASSWORD:lifelog}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:test-secret-key-minimum-32-characters-long-for-hmac}
  access-expiration: 900000
  refresh-idle-expiration: 1296000000      # 15일 — 마지막 회전 후 미사용 시 만료
  refresh-absolute-expiration: 2592000000  # 30일 — 최초 로그인 기준 최대 수명(회전해도 연장 안 됨)

# 테스트에서는 외부 특일 API 를 호출하지 않는다(키 비움 + 정기 동기화 빈 미등록)
special-day:
  service-key: ""
  sync:
    enabled: false
