name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: lifelog_test
          MYSQL_USER: lifelog
          MYSQL_PASSWORD: lifelog
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle') }}
          restore-keys: gradle-

      - name: Build and test
        working-directory: backend
        run: ./gradlew build
        env:
          DB_USERNAME: lifelog
          DB_PASSWORD: lifelog
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
          SPRING_PROFILES_ACTIVE: local
