name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'mobile/**'
      - '.github/workflows/**'

jobs:
  # 바뀐 영역만 검사한다. 비교 기준을 못 찾거나 워크플로우가 바뀌면 전부 검사.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            all=true
            files=""
          else
            files=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            all=false
            if echo "$files" | grep -q '^\.github/workflows/'; then all=true; fi
          fi
          for area in backend frontend mobile; do
            if [ "$all" = true ] || echo "$files" | grep -q "^$area/"; then
              echo "$area=true" >> "$GITHUB_OUTPUT"
            else
              echo "$area=false" >> "$GITHUB_OUTPUT"
            fi
          done

  build:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: lifelog_test
          MYSQL_USER: lifelog
          MYSQL_PASSWORD: lifelog
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('backend/**/*.gradle') }}
          restore-keys: gradle-

      - name: Build and test
        working-directory: backend
        run: ./gradlew build
        env:
          DB_USERNAME: lifelog
          DB_PASSWORD: lifelog
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long
          SPRING_PROFILES_ACTIVE: local

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      FLUTTER_VERSION: '3.47.5'

    steps:
      - uses: actions/checkout@v7

      - name: Cache Flutter SDK
        uses: actions/cache@v6
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_VERSION }}

      - name: Set up Flutter
        working-directory: .
        run: |
          if [ ! -x ~/flutter/bin/flutter ]; then
            git clone --depth 1 -b "$FLUTTER_VERSION" https://github.com/flutter/flutter.git ~/flutter
          fi
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"

      - run: flutter --version
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
